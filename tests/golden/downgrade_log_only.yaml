description: >-
  Identical to downgrade_enforcing, but the scorer is in log-only mode: the
  downgrades are evaluated and journaled by the pipeline, the decision record
  stays at tier 1 and carries no DOWNGRADED reason. A reason claiming a
  downgrade that was not applied would be a lie in the audit trail.
evidence:
  routing:
    - unit_id: Referat_312_Renten
      source: rule
      rule_ids: [rule_altersrente_hint]
      confidence: 1.0
  completeness:
    verdict: complete
    gap_ids: []
  min_confidence: 1.0
  discarded_count: 0
flags:
  procedure_id: altersrente
  tier1_enabled: true
  fully_automated: false
clear_cut: true
anomaly:
  score: 0.93
  flagged: true
scorer_mode: log_only
expect:
  tier: 1
  pre_downgrade_tier: 1
  routed_unit_id: Referat_312_Renten
  reason_kinds: [qualified]
  reason_rule_ids: [tier1_clear_and_complete]
