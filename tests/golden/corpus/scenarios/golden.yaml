# Fixed golden scenarios for tests/test_corpus_golden.py.
#
# Four items, one per outcome shape, built with seed 7 and compared against
# tests/golden/corpus/expected.yaml byte for byte. If a change to the renderer,
# the paraphrase pass or the label sidecar format alters any of them, this file
# pair is where it becomes visible - deliberately separate from the shipped
# corpus so a corpus rebuild cannot quietly "fix" the expectation.
