description: >-
  Two rules of equal priority proposed different units, so routing arbitration
  recorded the conflict and dropped the winner's confidence to 0.6. Both rows
  of table_v1 require confidence at or above 0.9, so neither qualifies and the
  item defaults to tier 3. The unit is still recorded - a contested item needs
  an addressee, it just does not get a confident hand-off.
evidence:
  routing:
    - unit_id: Referat_312_Renten
      source: rule
      rule_ids: [rule_altersrente_rentenart]
      confidence: 0.6
    - unit_id: Referat_316_Erwerbsminderungsrenten
      source: rule
      rule_ids: [rule_erwerbsminderung_eintritt]
      confidence: 0.5
  completeness:
    verdict: incomplete
    gap_ids: [rentenart]
  min_confidence: 1.0
  discarded_count: 0
flags:
  procedure_id: altersrente
  tier1_enabled: true
  fully_automated: false
clear_cut: false
anomaly: null
scorer_mode: log_only
expect:
  tier: 3
  pre_downgrade_tier: 3
  routed_unit_id: Referat_312_Renten
  reason_kinds: [failed, failed, defaulted]
  reason_rule_ids:
    - tier1_clear_and_complete
    - tier2_routable_incomplete
    - default
