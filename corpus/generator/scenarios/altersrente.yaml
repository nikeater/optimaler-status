# Scenario specs for the altersrente procedure (config/procedures/altersrente_v1.yaml).
#
# Each entry declares the facts of a case and the ground truth that follows from
# them. The renderer builds the payload from the same facts, so the labels are
# true by construction; `python -m corpus.generator.build` then re-runs the real
# pipeline over every rendered item and refuses to write the corpus if an
# outcome disagrees with what is declared here.
#
# `expected.derivation_source` is ground truth too, and it is required per item:
# "the channel told us" (hint), "the form told us" (content) and "nobody could
# tell" (none) are three different claims, and the middle one is what part 03
# added. It is never inferred from the other fields.
#
# Every value is invented. The Versicherungsnummern follow the real structure
# (Bereichsnummer, Geburtsdatum TTMMJJ, Anfangsbuchstabe, Seriennummer,
# Pruefziffer) and belong to nobody; dates and addresses are synthetic (see
# corpus/gold/v2/README.md).
description: >-
  Altersrente: clear complete cases, missing and invalid fields, cases that are
  complete but not clear-cut, applications whose procedure has to be read off
  the form, and internally consistent but statistically odd applications.

