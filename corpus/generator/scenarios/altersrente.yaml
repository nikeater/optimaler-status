    notes: >-
      Zuordnung kommt hier aus der Verfahrensregel (Prioritaet 40), nicht aus
      der Rentenart-Regel: ohne Rentenart feuert die inhaltliche Regel nicht.
      Ableitung und Zuordnung sind zwei Schritte, und dieses Item zeigt den
      Unterschied.

