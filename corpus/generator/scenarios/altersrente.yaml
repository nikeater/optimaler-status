      unit_id: Referat_316_Erwerbsminderungsrenten
      tier: 3
      derivation_source: none
      gaps: []
    notes: >-
      In v1 eine deklarierte Abweichung in Unit UND Tier. Teil 03 schliesst
      beide: die Inhaltsregel (Prioritaet 20) schlaegt den Kanalhinweis
      (Prioritaet 50), und weil Rentenbeginn und Rentenart auf verschiedene
      Verfahren zeigen, wird gar kein Verfahren abgeleitet. Ohne Verfahren
      gibt es keine Vollstaendigkeitspruefung, also auch keine Luecken - der
      Vorgang ist nicht unvollstaendig, er ist nicht pruefbar.

  # --------------------------- Verfahren steht nur im Formular (Teil 03) ---
  - scenario_id: ar-0050-ohne-verfahrenshinweis-vollstaendig
    kind: hint_missing
    description: >-
      Vollstaendiger, klarer Regelaltersrentenantrag, bei dem der Kanal kein
      Verfahren meldet. Das Verfahren steht eindeutig im Formular, also wird
      es abgeleitet, geprueft und freigegeben.
    procedure_id: altersrente
    procedure_hint: null
    facts:
      geburtsdatum: "1960-06-15"
      versicherungsnummer: "12150660F066"
      rentenart: regelaltersrente
      rentenbeginn: "2026-12-01"
      auslandsbezug: nein
    expected:
      unit_id: Referat_312_Renten
      tier: 1
      derivation_source: content
      gaps: []
    notes: >-
      Das Gegenstueck zu ar-0001 ohne Kanalhinweis. Es haelt eine bewusste
      Entscheidung fest: eine inhaltlich eindeutig abgeleitete Verfahrenszuordnung
      ist fuer Tier 1 zugelassen, weil sie deterministisch und geprueft ist.
      Waere das anders gewollt, braeuchte die Entscheidungstabelle ein neues
      qualifizierendes Feld (Contract-Anfrage, siehe ADR-013).

  - scenario_id: ar-0051-ohne-verfahrenshinweis-ohne-rentenart
    kind: hint_missing
    description: >-
      Kein Kanalhinweis und keine angekreuzte Rentenart, aber ein gewuenschter
      Rentenbeginn: das reicht fuer die Verfahrensableitung und damit fuer die
      Zuordnung, nicht fuer die Vollstaendigkeit.
    procedure_id: altersrente
    procedure_hint: null
