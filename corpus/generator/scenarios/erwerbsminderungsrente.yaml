    anomaly_expected: true
    anomaly_pattern: >-
      eintritt_in_der_zukunft: der angegebene Eintritt liegt nach dem
      Eingangsdatum; das Format ist gueltig, der Sachverhalt kann nicht
      stimmen. Die Datumsgrenze faengt ihn nicht ab, weil sie absolut ist und
      nicht am Eingangsdatum haengt.
