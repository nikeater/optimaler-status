    anomaly_expected: true
    anomaly_pattern: >-
      eintritt_alter: Eintritt der Erwerbsminderung wenige Wochen nach dem
      14. Geburtstag, bei gleichzeitig angegebener Erwerbstaetigkeit. Knapp
      innerhalb der Regelgrenze, weit ausserhalb der Verteilung - genau die
      Zone, fuer die es einen Scorer gibt.

