# Scenario specs for the erwerbsminderungsrente procedure.
#
# The procedure runs with tier1_enabled: false, so the interesting shape here is
# the one that looks paradoxical at first: a FORMALLY COMPLETE application ends
# at tier 3, not tier 1. The tier-1 row cannot qualify (the legal gate is off)
# and the tier-2 row requires an incomplete verdict, so a complete item falls
# through to the table default. That is the intended behaviour for a procedure
# that hangs on a sozialmedizinische Beurteilung, and these items are the
# regression test for it.
#
# Every value is invented (see corpus/gold/v2/README.md).
description: >-
  Erwerbsminderungsrente: complete applications that still need a caseworker,
  missing and invalid fields, an Auslandsfall, a contradictory Rentenart,
  applications whose procedure has to be read off the form, and two
  statistically odd but rule-passing items.

scenarios:
  # ------------------------------- complete, and still a case for a human ---
  - scenario_id: em-0001-volle-erwerbsminderung-vollstaendig
    kind: complete_clear
    description: >-
      Vollstaendiger Antrag auf volle Erwerbsminderungsrente mit vorliegendem
      Gutachten: alle Klarfallkriterien sind erfuellt, tier1_enabled ist aber
      false, also bleibt es bei der vollstaendigen fachlichen Pruefung.
    procedure_id: erwerbsminderungsrente
    procedure_hint: erwerbsminderungsrente
    facts:
      geburtsdatum: "1974-06-12"
      versicherungsnummer: "19120674A031"
      rentenart: erwerbsminderungsrente_voll
      eintritt_erwerbsminderung: "2025-11-04"
      letzte_taetigkeit: Lagerarbeiterin
      auslandsbezug: nein
      gutachten_status: liegt_vor
    expected:
      unit_id: Referat_316_Erwerbsminderungsrenten
      tier: 3
      derivation_source: hint
      gaps: []
    notes: >-
      Beleg dafuer, dass der Klarfall allein keine Tier-1-Freigabe erzeugt:
      erst der gesetzte Rechtsgrund in ProcedureFlags oeffnet Tier 1.

