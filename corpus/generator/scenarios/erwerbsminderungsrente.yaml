      Der Kanal meldet eine Erwerbsminderungsrente, im Formular ist die
      Regelaltersrente angekreuzt. Fachlich ist der Vorgang widerspruechlich und
      gehoert vollstaendig geprueft.
    procedure_id: erwerbsminderungsrente
    procedure_hint: erwerbsminderungsrente
    facts:
      geburtsdatum: "1960-06-24"
      versicherungsnummer: "18240660P082"
      rentenart: regelaltersrente
      eintritt_erwerbsminderung: "2026-05-02"
