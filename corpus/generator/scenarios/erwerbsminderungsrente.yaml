      tier: 3
      derivation_source: none
      gaps: []
    notes: >-
      In v1 eine deklarierte Tier-Abweichung: die Vollstaendigkeitspruefung sah
      nur eine unzulaessige Rentenart und stufte den Vorgang als unvollstaendig
      in Tier 2 ein. Teil 03 schliesst sie. Rentenart und Eintrittsdatum zeigen
      auf verschiedene Verfahren, also wird keines abgeleitet; die Zuordnung
      traegt der Kanalhinweis, gewuerdigt wird vollstaendig.

