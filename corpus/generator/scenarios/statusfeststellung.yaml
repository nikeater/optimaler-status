  - scenario_id: sf-0031-statusantrag-mit-rentenangaben
    kind: ambiguous_conflicting
    description: >-
      Der Kanal meldet eine Statusfeststellung, das Formular traegt zusaetzlich
      eine angekreuzte Regelaltersrente mit gewuenschtem Rentenbeginn. Zwei
      Verfahren beanspruchen denselben Vorgang, also wird keines abgeleitet.
