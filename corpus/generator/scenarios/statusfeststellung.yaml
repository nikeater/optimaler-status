# Scenario specs for the statusfeststellung procedure
# (config/procedures/statusfeststellung_v1.yaml, par. 7a SGB IV).
#
# THE SHAPE THIS FILE EXISTS FOR: a COMPLETE Statusantrag ends at tier 3.
#
# The tier-1 row cannot qualify (tier1_enabled is false and there is no
# clear_cut block at all), and the tier-2 row requires an INCOMPLETE verdict, so
# a complete, routable application matches no row and falls to the table default
# of tier 3. That is the em-0001 precedent, and here it is permanent rather than
# provisional: par. 7a Abs. 2 S. 1 SGB IV orders a Gesamtwuerdigung aller
# Umstaende des Einzelfalles, and no set of form fields can stand in for it. The
# triage value of these items is what triage is actually for - the item is
# received, receipted, checked for completeness, and routed to the unit that can
# decide it, with the decision itself untouched.
#
# So the four complete items below are labelled `complete_clear` with
# `expected.tier: 3` and no gaps. No tier "2.5" was invented, nothing was forced
# to tier 2, and no divergence is declared: this is not a divergence, it is the
# intended behaviour.
#
# The Indizien of the Gesamtabwaegung (Weisungsgebundenheit, Eingliederung,
# Arbeitsort, weitere Auftraggeber, Umsatzanteil, Honorarmodell, Rahmenvertrag)
# ride in the payload but are NOT requirements - see the field_map comment in
# the procedure config. They are what the anomaly patterns describe and what a
# caseworker weighs; they are never a checklist.
#
# Every value is invented. The Versicherungsnummern follow the real structure
# (Bereichsnummer, Geburtsdatum TTMMJJ, Anfangsbuchstabe, Seriennummer,
# Pruefziffer) and belong to nobody; firms, dates and addresses are synthetic
# (see corpus/gold/v3/README.md).
description: >-
  Statusfeststellung nach par. 7a SGB IV: complete applications that end at
  tier 3 by design, missing and invalid fields, a Prognoseantrag whose Beginn
  lies in the future and one whose Beginn lies in the past, contradictory
  Weisungsangaben, a form claimed by two procedures at once, three
  Scheinselbststaendigkeits-Indizienbuendel that pass every rule, and two
  applications whose procedure has to be read off the form.

