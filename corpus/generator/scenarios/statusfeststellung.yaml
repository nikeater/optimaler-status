    expected:
      unit_id: Referat_340_Clearingstelle
      tier: 3
      derivation_source: hint
      gaps: []
    notes: >-
      Kein Feld ist falsch, die Kombination ist es. Es gibt hier bewusst keine
      taktgebundene Kreuzpruefung "Prognose setzt einen Beginn in der Zukunft
      voraus": jede solche Regel muesste gegen die Uhr pruefen, und die
      Vollstaendigkeitspruefung liest keine Uhr - sonst begaenne ein
      eingefrorener Goldsatz an einem Dienstag zu scheitern. Fachlich deutet
      die DRV einen unmoeglich gewordenen Prognoseantrag in einen Antrag nach
      Aufnahme um; eine Umdeutung ist eine rechtliche Wertung, die kein
      Regelwerk vornehmen darf. Eine uhrfreie Kreuzpruefungsart (etwa
      "Antragsart passt zur Lage des Datums relativ zum Eingangsdatum") waere
      eine Contract-Anfrage, keine stille Erfindung.

