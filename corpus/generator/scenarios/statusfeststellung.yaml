      rentenbeginn: "2029-08-01"
    expected:
      unit_id: Referat_312_Renten
      tier: 3
      derivation_source: none
      gaps: []
    notes: >-
      Das Spiegelbild von ar-0033 und xx-0006 fuer das dritte Verfahren: die
      Signale der Altersrente und der Statusfeststellung feuern gleichzeitig,
      also wird nicht geraten und nichts geprueft ("nicht pruefbar" ist etwas
      anderes als "unvollstaendig"). Zugeordnet wird trotzdem jemand: zwei
      Regeln der Prioritaet 20 zeigen auf Referat 312 und Referat 340, die
      Ordnung (priority, rule_id) bestimmt den Gewinner deterministisch, die
      Confidence sinkt auf 0.6 und beide Zeilen der Entscheidungstabelle
      fallen aus. Ein Vorgang ohne Adressaten wartet sonst auf niemanden.

  - scenario_id: sf-0032-prognose-mit-beginn-in-der-vergangenheit
    kind: ambiguous_conflicting
    description: >-
      Angekreuzt ist der Prognoseantrag vor Aufnahme der Taetigkeit, angegeben
