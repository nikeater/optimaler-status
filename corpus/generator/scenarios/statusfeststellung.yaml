      Auftraggeber, eigene Betriebsstaette, Abrechnung nach Stunden - alle
      Pflichtangaben liegen vor, die Wuerdigung bleibt beim Menschen.
    procedure_id: statusfeststellung
    procedure_hint: statusfeststellung
    facts:
      geburtsdatum: "1985-03-14"
      versicherungsnummer: "12140385K023"
      antragsart: feststellung_nach_aufnahme
      antragsteller_rolle: auftragnehmer
      taetigkeit_bezeichnung: IT-Beratung und Softwareentwicklung
      taetigkeit_beginn: "2026-01-15"
      auftraggeber_name: Nordlicht Systemhaus GmbH
      auftraggeber_betriebsnummer: "12345678"
      weisungsgebunden: nein
      eingliederung_arbeitsorganisation: nein
      arbeitsort: eigene_betriebsstaette
