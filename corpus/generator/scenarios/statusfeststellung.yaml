    procedure_hint: statusfeststellung
    facts:
      geburtsdatum: "1991-03-02"
      versicherungsnummer: "26020391X056"
      antragsart: prognose_vor_aufnahme
      antragsteller_rolle: gemeinsam
      taetigkeit_bezeichnung: Tontechnik bei Veranstaltungen
      taetigkeit_beginn: "2024-03-01"
      auftraggeber_name: Buehnenwerk Veranstaltungstechnik GmbH
