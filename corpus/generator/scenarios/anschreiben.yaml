# Scenario specs for items that arrive as a LETTER instead of as a form (part 05).
#
# Every item in this file carries a `letter:` block, and an item with one has an
# EMPTY `data` object. That is the whole point of them: no payload path resolves,
# so the schema mapper extracts nothing, every `payload.*` derivation signal is
# silent and every routing rule that reads a payload path is silent. The item can
# only be understood through the text path - seal the identity spans, normalize,
# derive the procedure from `text.*`, propose values, verify every span against
# the normalized layer (ADR-019, ADR-020).
#
# The e-mail and the scan channel ride the same submission shape on purpose. A
# real IMAP/MIME adapter is part 07 (backlog P-14); what part 05 needs is the
# ENVELOPE a text item produces, and inventing a second inbound format to get it
# would have meant writing the adapter twice.
#
# `ocr_noise: true` applies seeded scanner mistakes OUTSIDE identity values,
# outside the labels the extractor locates values by, and outside values too
# short to survive a substitution. One of them lands inside a declared value, so
# the bounded-fuzzy lock is measured rather than configured; one is a line-break
# hyphenation the normalizer has to undo before the span can match at all.
#
# What is deliberately NOT here: an item whose letter carries identity a regular
# expression cannot find. A bare person name in the middle of a sentence is
# exactly what the optional NER member exists for, and a gold item that depended
# on it would make the gate depend on an optional wheel. The limit is documented
# in docs/KNOWN-ERRORS.md and demonstrated by a unit fixture instead.
#
# Every value is invented; the Versicherungsnummern follow the real structure and
# carry the stated birth date in positions 3 to 8 (see corpus/gold/v3/README.md).
description: >-
  Freitext-Anschreiben per E-Mail und als Scan, ueber alle drei Verfahren und
  ohne bestimmbares Verfahren: vollstaendige Antraege, fehlende und ungueltige
  Angaben, ein Anschreiben ganz ohne Angaben, widerspruechliche Schreiben und
  Schreiben, deren Kanalhinweis dem Text widerspricht.

