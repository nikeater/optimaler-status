# Demo personas v3 (config/demo/) - part 20, the simulated attachments.
#
# ITS OWN VERSIONED FILE, and the reason is the standing lesson of parts 06 to
# 12: `config/thresholds.yaml`, `config/rules/`, `config/decision/` and
# `config/taxonomy/` carry version strings that are frozen into
# `corpus/gold/v4/MANIFEST.yaml`, and a gold set is verified by a byte-identical
# rebuild. A persona added to one of those files would either invalidate a
# frozen corpus or ship under a version string that no longer describes the
# file. So this is a NEW file with a NEW id, and `engine.config_loader` does not
# read `config/demo/` at all: nothing here can reach the pipeline, the decision
# table or a version stamp. It is read by `engine/demo/personas.py`, which is
# imported only by the demo routes, which exist only when
# EINGANGSLOTSE_DEMO_MODE=1.
#
# WHY v3 SUPERSEDES v2 RATHER THAN EDITING IT. A persona grew a new part:
# `attachments`, the prepared documents a visitor may tick on the intake form.
# That is a SHAPE change, and the house rule for a versioned file whose shape
# changes is to supersede it - the same rule that produced routing_v3,
# taxonomy_drv_bund_v2 and v2 of this file - with only the current version left
# on disk. Nothing that existed in v2 moved: every persona id, every field,
# every value and every letter is the v2 text, byte for byte, apart from the
# two hints part 20 rewrote (see the panel below) and the one sentence Bernd
# Beispielmann's card gained.
#
# (v2 superseded v1 for the same reason one part earlier: `name` became
# `nachname` + `vorname`, fields grew a `control`, and every visitor-facing
# string grew an English sibling.)
#
# WHAT AN ATTACHMENT IS HERE, AND WHAT IT IS NOT. It is a PREPARED, SYNTHETIC
# document that the demo offers as a checkbox; ticking it puts a real
# attachment on the submission - `text` plus a `sourceType`, the same shape the
# corpus's e-mail and scan items ride on - so the boundary seals it span by
# span, the text layer normalizes it, derivation reads it and the pipeline view
# shows its working copy. There is NO file upload here and there will not be
# one: an upload control on a public page is an ingest path around the
# redaction boundary, which is the part-10 refusal, and the fieldset says so in
# words rather than leaving it to be noticed.
#
# THE DOCUMENT NAMES ARE REAL. They were researched against the Deutsche
# Rentenversicherung's own forms rather than invented, so a German caseworker
# reading a screenshot recognises them:
#   * Statusfeststellung par. 7a SGB IV - `V0027` Ziffer 16 lists what an
#     applicant encloses. `C0031` (Beschreibung des Auftragsverhaeltnisses) is
#     the narrative annex without which, in V0027's own words, no determination
#     can be made; "Saemtliche Einzelvertraege, Projektbeschreibungen und
#     Aufgabenbeschreibungen" and "Rechnungen in Kopie" are the other two, and
#     the second is required twice over (V0027 Ziffer 3.2 and C0031 Ziffer 3.1).
#   * Regelaltersrente - the application is `R0100`, and Ziffer 15 says
#     enclosures travel with `R0990` (Aufstellung ueber eingereichte bzw.
#     nachzureichende Unterlagen). Ziffer 16 names the Geburtsurkunde; `R0810`
#     is the Meldung zur Krankenversicherung der Rentner; "Nachweise ueber
#     Ausbildungszeiten" is the DRV's own wording for closing a gap in the
#     Versicherungsverlauf.
#   Two candidates were checked and REJECTED rather than used: `V0028` is the
#   guidance leaflet the DRV supplies and never something an applicant
#   encloses, and the Versicherungsverlauf is an OUTBOUND document the DRV
#   sends to the insured. Both would have read as wrong to a caseworker.
#
# THE TEXT IS BUILT FROM THE PERSONA'S OWN VALUES. Every `text` below is a
# template over this persona's field ids (`{versicherungsnummer}`, `{plz}`,
# ...), rendered once at LOAD time; an unknown key is a load error rather than
# a half-rendered document in front of a visitor. That is the gold-corpus
# method and it is what makes the documents deterministic: the same persona
# always produces the same bytes.
#
# WHAT THE TEXT MAY NOT SAY, and it is a rule rather than a style note.
#   1. DERIVATION. A document is text, and `text.normalized` is where the
#      content signals of `config/procedures/*.yaml` are read (ADR-020). Two
#      procedures' signals firing at once is an AMBIGUITY and resolves to "no
#      procedure", which is tier 3 - so an Altersrente document may not contain
#      "Auftraggeber" together with "Taetigkeit", and a Statusfeststellung
#      document may not contain "altersrente" or "Rentenbeginn". Checked by
#      `tests/test_demo_personas.py`.
#   2. THE ARC. An attachment may not turn a persona into a different story.
#      Bernd Beispielmann's documents in particular name no Rentenbeginn: his
#      whole arc is the missing one, and a document that supplied it would
#      close his gap and make him a second Renate.
#   3. THE SEALING. Same rule as the letters: identity appears only in shapes
#      the DETERMINISTIC detector union recognises without the optional NER
#      model - a name behind "Frau"/"Herr", the address as "<Strasse> <Nr>,
#      <PLZ> <Ort>", the birth date labelled, the Versicherungsnummer labelled.
#      A document that needed spaCy to be sealed would be refused on the hosted
#      demo and accepted on a developer machine.
#   4. THE COLLISION RULE below applies to every word of them, invented company
#      and institution names included.
#
# WHY NO `extractionFixture`, and it was MEASURED before it was decided. The
# corpus ships a fixture next to every generated letter so the replay extractor
# can produce proposals for the verifier. It cannot do that here, and the
# reason is a property of this channel: a form submission's structured payload
# already fills every field the procedure's `field_map` declares, and ADR-020's
# precedence rule says the schema mapper wins - so a text proposal over any of
# those fields is discarded as `duplicate_field` before the double lock even
# runs. Measured consequence: adding one fixture entry to Renate's attachment
# takes her from tier 1 to tier 3, because `extraction.discarded_count == 0` is
# a qualifying condition of the tier-1 row. A fixture here would therefore
# measure nothing and cost two personas their arc.
# `tests/test_demo_personas.py::test_an_attachment_fixture_would_only_ever_be_a_duplicate`
# runs that measurement so the reason stays true rather than remembered.
#
# WHAT A PERSONA IS. A fictional applicant whose submission is PII-SHAPED BY
# DESIGN. Sealing it live is the demonstration: the visitor watches their own
# typed Versicherungsnummer disappear behind a placeholder before anything
# downstream sees it. Every value below is invented for this file.
#
# THE NAMING RULE, and it is a rule rather than a preference. Every persona name
# is Mustermann-class - unmistakably fictional to a German reader, the way
# "Erika Mustermann" is on the specimen Personalausweis. A demo persona called
# "Michael Weber" would be indistinguishable from a real person's data on a
# screenshot, and a screenshot is exactly what a demo produces.
#
# THE COLLISION RULE. No value here may equal a value in `corpus/pii_golden/`
# (the redaction-recall canaries) or an identity value in `corpus/gold/`. Two
# reasons, and the second one is the load-bearing one:
#   1. A persona that reused a canary string would make the canary sweep over
#      the demo pages meaningless - it would find the string and could not tell
#      a leak from a persona.
#   2. A recall measurement over a corpus that shares values with a live demo
#      is a measurement that can be gamed by memorisation.
# `tests/test_demo_personas.py::test_no_persona_value_collides_with_a_frozen_set`
# asserts it over every value in this file, so the rule is checked rather than
# promised. It now checks the two halves of each name separately, which is a
# strictly stronger check than checking the joined string was.
#
# THE VERSICHERUNGSNUMMER RULE. Each one is checksum-VALID (the weighted
# modulo-10 scheme in `engine/redact/recognizers.py`) and carries its persona's
# birth date in positions 3 to 8. Both are necessary: the deterministic
# recognizer is checksum-gated in prose, so an invented number with a broken
# check digit would not be sealed out of a letter, and the completeness
# checker's `birthdate_in_vsnr` cross-field check reads the real value through
# the transient witness.
#
# THE LETTER RULE. Every letter names the person behind a salutation
# ("Frau ...", "Herrn ..."), writes the address as "<Strasse> <Nr>, <PLZ> <Ort>"
# and labels the birth date. That is not decoration: those are the shapes the
# deterministic detector union recognises without the optional NER model
# (ADR-019, ruling 2), and the hosted demo image ships without it. A letter that
# needed spaCy to be sealed clean would be refused by the boundary on the demo
# and accepted on a developer machine. **The letters are byte-identical to v1
# and deliberately keep their transliterated spelling**: they are submission
# DATA that content-derivation rules read, not interface text (ADR-031).
#
# THE SPLIT NAME (part 16). `nachname` and `vorname` declare the SAME path and
# are joined by `join_order` into the one "Vorname Nachname" string the envelope
# has always carried. The form asks surname-first because a German
# administrative form asks surname-first; the value is built given-name-first
# because that is the value. `engine/demo/personas.py::build_form_submission`
# is the single place the two orders meet.
#
# THE CONTROLS (part 16). `control` picks the HTML control and changes nothing
# about what is submitted. `date` renders a native picker whose value is the
# same ISO string that used to be typed; `select` renders a dropdown. A select's
# options come from the procedure configuration when the requirement has a
# `one_of` (antragsart, antragsteller_rolle - resolved at render time by
# `api/demo.py::vocabulary`, so the page cannot offer a value the completeness
# checker would reject), and from an explicit `options` list when it does not.
# The one explicit list here, for `taetigkeit_bezeichnung`, is READ from the
# corpus scenario file `corpus/generator/scenarios/statusfeststellung.yaml` and
# keeps that file's transliterated spelling verbatim, because those strings are
# data rather than interface text.
#
# THE ENGLISH SIBLINGS. `*_en` keys carry the English of every visitor-facing
# string. Absent means "German is the only wording there is", which is true of
# every value, every path, every letter and every attachment TEXT, and false of
# nothing else here. An attachment's `label` and `note` are read by a visitor
# and therefore have siblings; its `text` is submission data that content rules
# read, so it keeps the transliterated spelling of the letters (ADR-031).
version: personas_v3

#: What the intake page says above the picker. One sentence, and it is the same
#: sentence whether or not anybody reads the ribbon.
note: >-
  Alle Personen auf dieser Seite sind frei erfunden. Namen, Geburtsdaten,
  Versicherungsnummern und Anschriften wurden für diese Demonstration
  konstruiert und gehören zu keinem Menschen.

note_en: >-
  Every applicant on this page is invented. The names, dates of birth,
  insurance numbers and addresses were constructed for this demonstration and
  belong to nobody.

#: Suggestions shown next to every form, in the "was Sie ausprobieren koennen"
#: panel. Each one produces a DIFFERENT, real behaviour of the pipeline, which
#: is the point: a demo you cannot break teaches nothing. Updated in part 16 to
#: match the controls the form actually renders.
#:
#: PART 20 REWROTE THE TWO THAT INSTRUCTED A DELETION, because every prefilled
#: field is a required field now and a visitor cannot empty one. They were
#: replaced rather than dropped, and both replacements were MEASURED against
#: the pipeline before they were written:
#:
#:   * the missing-field path moved to where it still exists, Bernd
#:     Beispielmann's own form (his Rentenbeginn is empty by design and is the
#:     one control here that is not required);
#:   * "Vornamen leeren" became the auto-seal path of ADR-017, which nothing
#:     else on this page shows: placeholder-shaped input in a non-identity
#:     field is sealed by the boundary itself on a second pass, the witness
#:     still carries the typed string, and the procedure's allowed list rejects
#:     it. Verified: tier 2, `antrag.rentenart` reported invalid,
#:     `auto_sealed_paths` naming the field.
#:
#: One candidate was measured and DROPPED: breaking the check digit of a
#: Versicherungsnummer changes nothing a visitor can see (tier 1, complete).
#: The requirement validates a PATTERN and the birth date it encodes, not the
#: Pruefziffer, and the REDACT profile seals on format alone - so the hint
#: would have promised a behaviour that does not happen.
hints:
  - label: Eine fehlende Angabe absenden
    detail: >-
      Wechseln Sie oben zu Bernd Beispielmann. Sein Rentenbeginn ist bewusst
      leer und ist das einzige Feld dieser Demonstration, das kein Pflichtfeld
      ist - Sie können seinen Antrag also unverändert abschicken. Die
      Vollständigkeitsprüfung meldet eine Lücke, der Vorgang fällt auf Tier 2
      und es entsteht eine Nachforderung mit genau dem Satz, den die
      Verfahrenskonfiguration dafür vorsieht.
  - label: Geburtsdatum unplausibel setzen
    detail: >-
      Wählen Sie im Kalender den 1. Januar 1902. Die Versicherungsnummer trägt
      das Geburtsdatum in den Stellen 3 bis 8 und passt dann nicht mehr dazu:
      die Kreuzprüfung schlägt an, ohne dass irgendetwas entsiegelt wird.
  - label: Rentenbeginn weit in die Zukunft legen
    detail: >-
      Wählen Sie den 1. Januar 2048. Die Kalendergrenzen der
      Verfahrenskonfiguration fangen das bewusst nicht ab - das ist die Aufgabe
      des Schattenscorers, der den Vorgang markiert und seinen Grund im
      Klartext nennt.
  - label: Auslandsbezug auf "ja" setzen
    detail: >-
      Die Zuständigkeitsregel mit Priorität 10 gewinnt gegen die
      Rentenart-Regel: der Vorgang geht an das Referat Auslandsrenten, und die
      unterlegenen Vorschläge bleiben als Konflikt im Journal stehen.
  - label: Rentenart auf etwas Unbekanntes setzen
    detail: >-
      Schreiben Sie "grundrente" in das Textfeld. Der Wert steht nicht in der
      erlaubten Liste, die Angabe gilt als ungültig und der Klarfall entfällt.
      Dieses Feld ist mit Absicht ein Textfeld geblieben und keine Auswahl.
  - label: Unterlagen beilegen
    detail: >-
      Haken Sie unten ein oder mehrere Dokumente an. Jedes angehakte Dokument
      wird zu einer echten Anlage der Einreichung: die Erkennerunion versiegelt
      Name, Anschrift, Geburtsdatum und Versicherungsnummer SPANNE FÜR SPANNE,
      das Dokument bekommt eine eigene Textebene, und im nächsten Schritt steht
      seine Arbeitskopie neben der des Formulars. Die Zahl der versiegelten
      Stellen steigt sichtbar mit.
  - label: Platzhalter-Syntax nachahmen
    detail: >-
      Schreiben Sie "[[PII|VSNR|test]]" in das Feld Rentenart. Die
      Schwärzungsprüfung erkennt Text, der die reservierte Syntax nur nachahmt,
      versiegelt das Feld daraufhin selbst und prüft erneut - in der
      Arbeitskopie steht danach ein echter Platzhalter. Die
      Vollständigkeitsprüfung liest Ihren Wert weiterhin über den flüchtigen
      Zeugen, findet ihn nicht in der erlaubten Liste und meldet die Angabe als
      ungültig.

hints_en:
  - label: Submit an application with something missing
    detail: >-
      Switch to Bernd Beispielmann above. His pension start date is empty by
      design and is the one control in this demonstration that is not a
      required field, so you can submit his application unchanged. The
      completeness check reports a gap, the case drops to tier 2, and a request
      for information is prepared using exactly the sentence the procedure
      configuration provides for it.
  - label: Make the date of birth implausible
    detail: >-
      Pick 1 January 1902 in the calendar. The insurance number carries the
      date of birth in positions 3 to 8 and no longer matches it: the
      cross-field check fires without anything being unsealed.
  - label: Push the pension start date far into the future
    detail: >-
      Pick 1 January 2048. The calendar bounds in the procedure configuration
      deliberately do not catch this - that is the shadow scorer's job, and it
      flags the case and names its reason in plain words.
  - label: Set the cross-border flag to "ja"
    detail: >-
      The routing rule with priority 10 beats the pension-type rule: the case
      goes to the foreign-pensions unit, and the proposals that lost stay in
      the journal as a recorded conflict.
  - label: Set the pension type to something unknown
    detail: >-
      Type "grundrente" into the text box. The value is not in the allowed
      list, the field counts as invalid and the clear-cut path falls away. This
      field is deliberately still a text box and not a dropdown.
  - label: Enclose some documents
    detail: >-
      Tick one or more documents below. Each ticked document becomes a real
      attachment on the submission: the detector union seals the name, the
      address, the date of birth and the insurance number SPAN BY SPAN, the
      document gets a text layer of its own, and the next step shows its
      working copy beside the form's. The count of sealed spans goes up with
      it, visibly.
  - label: Imitate the placeholder syntax
    detail: >-
      Type "[[PII|VSNR|test]]" into the pension-type field. The redaction check
      recognises text that merely imitates the reserved syntax, seals the field
      itself and sweeps again - the working copy then holds a real placeholder.
      The completeness check still reads your value through the transient
      witness, does not find it in the allowed list, and reports the field as
      invalid.

personas:
  # ------------------------------------------------------------ arc 1: tier 1 --
  - persona_id: mustermann_regelaltersrente
    display_name: Renate Mustermann
    headline: Regelaltersrente, vollständig
    headline_en: Old-age pension, complete
    procedure_hint: altersrente
    story: >-
      Frau Mustermann wird im Dezember 66 und stellt ihren Antrag auf
      Regelaltersrente online. Alle vier Pflichtangaben stehen im Formular, es
      gibt keinen Auslandsbezug.
    story_en: >-
      Frau Mustermann turns 66 in December and files her old-age pension
      application online. All four mandatory fields are in the form and there is
      no cross-border element.
    expectation: >-
      Vollständig, klar zugeordnet, Klarfall: Tier 1 beim Referat 312. In
      Phase 3 wartet ein Bewilligungsentwurf auf die Bestätigung eines
      Menschen - vorbereitet, nicht erlassen.
    expectation_en: >-
      Complete, cleanly routed, clear-cut: tier 1 at unit 312. In phase 3 a
      draft approval waits for a human to confirm it - prepared, not issued.
    fields:
      - field_id: nachname
        label: Nachname
        label_en: Surname
        path: antragsteller.name
        join_order: 2
        value: Mustermann
        kind: NAME
        group: name
      - field_id: vorname
        label: Vorname
        label_en: Given name
        path: antragsteller.name
        join_order: 1
        value: Renate
        kind: NAME
        group: name
      - field_id: geburtsdatum
        label: Geburtsdatum
        label_en: Date of birth
        path: antragsteller.geburtsdatum
        control: date
        value: "1960-06-26"
        kind: GEBDAT
      - field_id: versicherungsnummer
        label: Versicherungsnummer
        label_en: Insurance number
        path: antragsteller.versicherungsnummer
        value: 65260660M123
        kind: VSNR
      - field_id: strasse
        label: Straße
        label_en: Street
        path: antragsteller.anschrift.strasse
        value: Lotsenweg
        kind: ADDR
        group: anschrift
      - field_id: hausnummer
        label: Hausnummer
        label_en: Number
        path: antragsteller.anschrift.hausnummer
        value: "7"
        kind: ADDR
        group: anschrift
      - field_id: plz
        label: Postleitzahl
        label_en: Postcode
        path: antragsteller.anschrift.plz
        value: "21029"
        kind: ADDR
        group: anschrift
      - field_id: ort
        label: Ort
        label_en: Town
        path: antragsteller.anschrift.ort
        value: Musterhafen
        kind: ADDR
        group: anschrift
      - field_id: rentenart
        label: Rentenart
        label_en: Pension type
        path: antrag.rentenart
        value: regelaltersrente
        help: >-
          regelaltersrente, altersrente_langjaehrig oder
          altersrente_schwerbehinderung
        help_en: >-
          regelaltersrente, altersrente_langjaehrig or
          altersrente_schwerbehinderung
      - field_id: rentenbeginn
        label: Gewünschter Rentenbeginn
        label_en: Requested pension start
        path: antrag.rentenbeginn
        control: date
        value: "2026-12-01"
      - field_id: auslandsbezug
        label: Auslandsbezug
        label_en: Cross-border element
        path: antrag.auslandsbezug
        value: nein
        help: ja oder nein
        help_en: ja or nein
    attachments:
      - attachment_id: r0990_aufstellung
        filename: R0990-aufstellung-unterlagen.pdf
        label: R0990 - Aufstellung über eingereichte Unterlagen
        label_en: R0990 - list of documents enclosed
        note: >-
          Das Deckblatt, mit dem die Rentenversicherung Anlagen zum
          Rentenantrag erwartet (R0100, Ziffer 15).
        note_en: >-
          The cover sheet the pension insurance expects enclosures to travel
          with (R0100, item 15).
        text: |
          Deutsche Rentenversicherung Bund
          Aufstellung ueber eingereichte bzw. nachzureichende Unterlagen
          (Vordruck R0990)

          Versicherte: Frau {vorname} {nachname}
          Geburtsdatum: {geburtsdatum}
          Versicherungsnummer: {versicherungsnummer}
          Anschrift: {strasse} {hausnummer}, {plz} {ort}

          Beigefuegt: Geburtsurkunde in beglaubigter Kopie
          Beigefuegt: Meldung zur Krankenversicherung der Rentner
          Nachzureichen: nichts

          Vorbereitetes Beispieldokument dieser Demonstration.
      - attachment_id: geburtsurkunde
        filename: geburtsurkunde-beglaubigte-kopie.pdf
        label: Geburtsurkunde (beglaubigte Kopie)
        label_en: Birth certificate (certified copy)
        note: >-
          R0100, Ziffer 16: die Angaben zur Person werden durch eine
          Geburtsurkunde oder einen gültigen Ausweis belegt.
        note_en: >-
          R0100, item 16: the personal details are evidenced by a birth
          certificate or a valid identity document.
        text: |
          Geburtsurkunde (beglaubigte Kopie)

          Name: Frau {vorname} {nachname}
          Geburtsdatum: {geburtsdatum}
          Wohnanschrift: {strasse} {hausnummer}, {plz} {ort}

          Ausgestellt von einer Beispielbehoerde dieser Demonstration.
      - attachment_id: r0810_kvdr
        filename: R0810-meldung-kvdr.pdf
        label: R0810 - Meldung zur Krankenversicherung der Rentner
        label_en: R0810 - registration for pensioners' health insurance
        note: >-
          Begleitvordruck jedes Rentenantrags: er meldet die
          Krankenversicherung der Rentner an.
        note_en: >-
          The companion form of every pension application: it registers the
          pensioners' health insurance.
        text: |
          Meldung zur Krankenversicherung der Rentner (Vordruck R0810)

          Versicherte: Frau {vorname} {nachname}
          Geburtsdatum: {geburtsdatum}
          Versicherungsnummer: {versicherungsnummer}

          Krankenkasse: Beispielkasse
          Mitglied seit: 1982-10-01

          Vorbereitetes Beispieldokument dieser Demonstration.
    letter: |
      Betreff: Antrag auf Regelaltersrente

      Sehr geehrte Damen und Herren,

      hiermit beantrage ich meine Regelaltersrente und bitte um Bearbeitung
      meines Antrags.

      Mein Name ist Frau Renate Mustermann, geboren am 1960-06-26.
      Meine Anschrift: Lotsenweg 7, 21029 Musterhafen.
      Meine Versicherungsnummer lautet 65260660M123.

      Rentenart: regelaltersrente
      Rentenbeginn: 2026-12-01
      Auslandsbezug: nein

      Mit freundlichen Gruessen
      Frau Renate Mustermann

  # ------------------------------------------- arc 2: tier 2, Nachforderung --
  #
  # DEPRECATION-PENDING (user ruling 2026-08-18, part 20). This persona is
  # marked for removal in a later part and must not constrain a design decision
  # again: the required-fields rule was settled WITHOUT regard to his arc, and
  # the only accommodation he gets is the honest one below - his empty
  # Rentenbeginn is the single control in this demo that is not a required
  # field, and his card says so, because a form that behaves differently on one
  # screen has to explain itself on that screen. When he is removed, the rule
  # in `api/demo.py::required_for` does not change; it simply has nothing left
  # to except, and the first hint in the panel above has to move with him.
  - persona_id: beispielmann_ohne_rentenbeginn
    display_name: Bernd Beispielmann
    headline: Altersrente ohne Rentenbeginn
    headline_en: Old-age pension without a start date
    procedure_hint: altersrente
    story: >-
      Herr Beispielmann füllt das Formular aus, lässt aber offen, ab wann er
      seine Rente beziehen möchte. Sonst ist alles da.
    story_en: >-
      Herr Beispielmann fills in the form but leaves open when he wants his
      pension to start. Everything else is there.
    expectation: >-
      Zuordenbar, aber unvollständig: Tier 2 beim Referat 312. Es entsteht
      eine Nachforderung, die genau die fehlende Angabe abfragt - im Wortlaut
      der Verfahrenskonfiguration, nicht in einem erzeugten Satz. Sein leerer
      Rentenbeginn ist das einzige Feld dieser Demonstration, das kein
      Pflichtfeld ist: nur dieser Antrag lässt sich unverändert mit einer
      fehlenden Angabe abschicken.
    expectation_en: >-
      Routable but incomplete: tier 2 at unit 312. A request for information is
      prepared that asks for exactly the missing field - in the procedure
