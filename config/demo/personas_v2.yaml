    procedure_hint: null
    story: >-
      Frau Musterfrau arbeitet seit Januar als freie IT-Beraterin für einen
      einzigen größeren Auftraggeber und will wissen, ob das eine
      selbständige Tätigkeit ist. Sie schreibt einen Brief, kein Formular,
      und nennt das Verfahren nicht beim Namen.
    story_en: >-
      Frau Musterfrau has been working since January as a freelance IT
      consultant for one larger client and wants to know whether that counts as
      self-employment. She writes a letter rather than a form, and never names
      the procedure.
    expectation: >-
      Ohne Kanalhinweis: das Verfahren wird aus dem INHALT abgeleitet
      (Auftraggeber und Tätigkeit gemeinsam benannt) und der Vorgang geht an
      die Clearingstelle, Referat 340. Par. 7a verlangt eine Gesamtwürdigung
      und keine Checkliste - deshalb ist für dieses Verfahren Tier 1 gar nicht
      freigeschaltet und der Vorgang landet vollständig bei einem Menschen.
    expectation_en: >-
      With no channel hint, the procedure is derived from the CONTENT (a client
      and an activity named together) and the case goes to the clearing unit,
      340. Par. 7a demands an overall appraisal rather than a checklist, which
      is why tier 1 is not enabled for this procedure at all and the case lands
      with a human in full.
