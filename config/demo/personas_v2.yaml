  # ------------------------------------------------ arc 4: anomaly-primed --
  - persona_id: musterkind_rentenbeginn_2048
    display_name: Theo Musterkind
    headline: Altersrente mit Rentenbeginn weit voraus
    headline_en: Old-age pension with a start date far ahead
    procedure_hint: altersrente
    story: >-
      Herr Musterkind füllt das Formular vollständig und regelkonform aus -
      und trägt als gewünschten Rentenbeginn ein Datum weit in der Zukunft
      ein. Jede einzelne Angabe ist zulässig.
    story_en: >-
      Herr Musterkind fills the form in completely and within every rule - and
      enters a requested pension start far in the future. Every single field is
      permissible on its own.
    expectation: >-
      Die Kalendergrenzen der Verfahrenskonfiguration sind absolut und weit;
      sie fangen "möglich, aber ungewöhnlich" bewusst nicht ab. Genau das ist
      die Aufgabe des Schattenscorers: er markiert den Vorgang und nennt seinen
      Grund im Klartext. Weil der Scorer im Modus log_only läuft, BEWEGT die
      Markierung nichts - die Seite zeigt an, welches Tier ein scharfgestellter
      Scorer gesetzt hätte, und dass die Entscheidung ohne ihn zustande kam.
    expectation_en: >-
      The calendar bounds in the procedure configuration are absolute and wide;
      they deliberately do not catch "possible but unusual". That is exactly the
      shadow scorer's job: it flags the case and names its reason in plain
      words. Because the scorer runs in log_only mode the flag MOVES nothing -
      the page shows which tier an armed scorer would have set, and that the
      decision was reached without it.
    fields:
      - field_id: nachname
        label: Nachname
        label_en: Surname
        path: antragsteller.name
        join_order: 2
        value: Musterkind
        kind: NAME
        group: name
      - field_id: vorname
        label: Vorname
        label_en: Given name
        path: antragsteller.name
        join_order: 1
        value: Theo
        kind: NAME
        group: name
      - field_id: geburtsdatum
